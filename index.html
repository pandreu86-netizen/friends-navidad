<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Friends.</title>
<meta name="theme-color" content="#f5f2ec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Friends">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ec;--card:#fff;--card2:#f1ece4;--accent:#b4532f;--accent2:#f4e6de;--ink:#1d1c1a;--sage:#5f7a5c;--sage2:#e6ede3;--gold:#b08a3e;--gold2:#f3ecdc;--txt:#1d1c1a;--mut:#8b857c;--line:#e6e0d6;--dash:#ece6dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}
.h{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.2px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 6px;gap:10px}
.logo{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;color:var(--ink);letter-spacing:-1px;line-height:1;cursor:pointer}
.logo i{font-style:normal;color:var(--accent)}
.mechip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(29,28,26,.03),0 6px 20px rgba(29,28,26,.04)}
.card.tap{cursor:pointer}
.card.sun{background:var(--gold2);border-color:#e8dcc0}.card.teal{background:var(--sage2);border-color:#d3dfcf}.card.lilac{background:#efebf3;border-color:#e0d9e8}.card.pink{background:var(--accent2);border-color:#ecd3c6}.card.coral{background:var(--accent2);border-color:#ecd3c6}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.center{text-align:center}.b{font-weight:700}
.btn{display:inline-block;border:1px solid var(--ink);border-radius:12px;padding:11px 16px;font:600 15px Inter,sans-serif;color:#fff;background:var(--ink);cursor:pointer;transition:opacity .15s,transform .08s;text-decoration:none;text-align:center}
.btn:active{transform:scale(.98);opacity:.85}
.btn.coral{background:var(--accent);border-color:var(--accent);color:#fff}.btn.teal{background:var(--sage);border-color:var(--sage);color:#fff}.btn.lilac{background:var(--ink);color:#fff}.btn.pink{background:var(--accent2);border-color:#ecd3c6;color:var(--accent)}
.btn.ghost{background:var(--card);color:var(--txt);border-color:var(--line)}
.btn.full{width:100%;display:block;margin:12px 0}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font:16px Inter,sans-serif;margin:5px 0 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
input[type=checkbox]{width:auto;margin:0}
textarea{min-height:76px;resize:vertical}
label{display:block;font-weight:600;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:6px 12px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .av{margin:-2px 0 -2px -6px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin:14px 0 4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 4px;font:500 14px Inter,sans-serif;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ttl{font-size:18px;margin:0 0 8px}
.ttl.coral{color:var(--accent)}.ttl.teal{color:var(--sage)}.ttl.lilac{color:var(--ink)}
.sec{font-size:22px;margin:28px 0 4px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;vertical-align:middle;background:var(--accent2);border:2px solid #fff;box-shadow:0 0 0 1px var(--line);flex:0 0 auto;font-family:Fraunces,Georgia,serif;font-weight:600;color:var(--accent)}
.av.kid{background:var(--gold2);color:var(--gold)}
.avs{display:inline-flex}.avs .av{margin-right:-8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--dash)}
.item:last-child{border:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.pill{align-self:flex-start;flex:0 0 auto;display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--txt);white-space:nowrap;letter-spacing:.2px}
.pill.coral{background:var(--accent);color:#fff}.pill.teal{background:var(--sage);color:#fff}.pill.sun{background:var(--gold2);color:var(--gold)}.pill.lilac{background:var(--ink);color:#fff}
.days{font:600 22px Fraunces,Georgia,serif;color:var(--accent);text-align:center;min-width:52px;line-height:1}
.days small{display:block;font:500 11px Inter;color:var(--mut);margin-top:2px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.vbar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.vbar .w{flex:0 0 44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .bar{flex:1}
.stars{display:inline-flex;gap:2px}
.stars button{background:none;border:0;font-size:24px;padding:0 1px;cursor:pointer;filter:grayscale(1);opacity:.3}
.stars button.on{filter:none;opacity:1}
.rk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--dash)}
.rk:last-child{border:0}
.rk .pos{font:600 20px Fraunces,Georgia,serif;width:30px;text-align:center;color:var(--mut)}
.rk .sc{font:600 26px Fraunces,Georgia,serif;color:var(--ink)}
.hero{text-align:center;background:var(--ink);color:#f5f2ec;border:0;padding:30px 18px}
.hero .big{font:600 54px Fraunces,Georgia,serif;line-height:1;letter-spacing:-1.5px}
.hero .big i{font-style:normal;color:#e08a68}
.hero p{color:#cfc8bc}
.hero .h{color:#cfc8bc}
.bday{text-align:center;background:linear-gradient(160deg,#fff 0%,var(--accent2) 100%)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 12px;text-align:left;cursor:pointer;font:600 15px Inter;box-shadow:0 1px 2px rgba(29,28,26,.03)}
.tile .e{font-size:24px;display:block;margin-bottom:10px}
.tile:active{transform:scale(.98)}
.sema{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.sema .p{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;width:52px;text-align:center;color:var(--mut)}
.sema .p .av{box-shadow:0 0 0 2.5px var(--line)}
.sema .libre .av{box-shadow:0 0 0 2.5px #4f9a5b}.sema .quiza .av{box-shadow:0 0 0 2.5px #d4a133}.sema .ocupada .av{box-shadow:0 0 0 2.5px #c4573a;filter:grayscale(.7)}
.sema .none .av{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.back{background:none;border:0;font:500 15px Inter;color:var(--mut);cursor:pointer;padding:14px 0 0}
.frase{font:italic 500 19px Fraunces,Georgia,serif;line-height:1.35}
.locked{filter:blur(5px);user-select:none}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--mut);font:500 11px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;position:relative;cursor:pointer}
nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);font-weight:600}
nav button.on svg{stroke-width:2.1}
nav .badge{position:absolute;top:0;right:24%;background:var(--accent);color:#fff;border-radius:99px;font-size:10px;min-width:17px;padding:1px 5px;font-weight:700}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-200%);background:var(--ink);color:#fff;font-weight:500;padding:12px 18px;border-radius:14px;z-index:30;transition:transform .3s;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.on{transform:translateX(-50%) translateY(env(safe-area-inset-top))}
#modal{position:fixed;inset:0;background:rgba(29,28,26,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .box{background:var(--bg);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mhead .ttl{font-size:21px}
.x{background:var(--card2);border:0;border-radius:50%;width:32px;height:32px;font-size:14px;cursor:pointer;flex:0 0 auto;color:var(--mut)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0}
.pick button{background:none;border:0;color:var(--txt);font:500 14px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:0}
.pick img,.pick .noimg{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.pick .noimg{display:flex;align-items:center;justify-content:center;background:var(--accent2);color:var(--accent);font:600 32px Fraunces,Georgia,serif}
.pick button.on img,.pick button.on .noimg{box-shadow:0 0 0 3px var(--ink)}
.pick button.taken{opacity:.3;pointer-events:none}
.meav{position:relative;display:inline-block;cursor:pointer}
.meav .cam{position:absolute;right:0;bottom:0;background:var(--ink);color:#fff;border:2px solid #fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:13px}
a{color:var(--accent);font-weight:600}
.empty{color:var(--mut);text-align:center;padding:12px 0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app">
  <header><div class="logo" data-act="tab" data-v="home">Friends<i>.</i></div><div id="mechip"></div></header>
  <div id="alerts"></div>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
/* ================= CONSTANTES ================= */
const PRESETS=[['patri','Patri',1],['rochi','Rochi',1],['cris','Cris',1],['vir','Vir',1],['gerti','Gerti',1],['piti','Piti',1],['gou','Gou',1],['chari','Chari',0],['gloria','Gloria',0]];
const RANK_FROM=new Date(2026,10,25).getTime(),RANK_TO=new Date(2027,11,31,23,59,59).getTime();
const RECO_CATS=[['bar','🍻','Bares'],['resto','🍽️','Restaurantes'],['peli','🎬','Pelis'],['serie','📺','Series'],['libro','📚','Libros'],['otro','✨','Otros']];
const Q_TYPES=[['bar','🍻','Bar'],['resto','🍽️','Comer / cenar'],['casa','🏠','En casa'],['plan','🌳','Plan'],['otro','🎉','Otro']];
const F_TYPES=[['aniversario','💍','Aniversario'],['boda','💒','Boda'],['santo','😇','Santo'],['otro','⭐','Otra fecha']];
const AWARD_CATS=['La que más ha liado','La más graciosa','La autora de la frase del año','La reina del drama','La más fiestera','La más desaparecida','La que más nos ha cuidado','Mejor look del año'];
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const SEMA=[['libre','🟢','Libre'],['quiza','🟡','Quizás'],['ocupada','🔴','Ocupada']];
const COLS=['kids','fechas','wishes','botes','quedadas','encuestas','semaforo','recos','gastos','viajes','awards','awardvotes','capsula','frases','confes'];

/* ================= UTILIDADES ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fDate=ts=>{const d=new Date(ts);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const fDateT=ts=>fDate(ts)+' · '+hm(ts);
const fDay=s=>{const p=s.split('-').map(Number);return p[2]+' de '+MESESL[p[1]-1]};
const parseYMD=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const euro=n=>(Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
function nextOcc(s){const p=s.split('-').map(Number),t=today0();let n=new Date(t.getFullYear(),p[1]-1,p[2]);if(n<t)n=new Date(t.getFullYear()+1,p[1]-1,p[2]);return{date:n,days:Math.round((n-t)/864e5),age:p[0]>1900?n.getFullYear()-p[0]:null}}
function weekendKey(){const t=today0(),dw=t.getDay();t.setDate(t.getDate()+(dw===0?-1:6-dw));return ymd(t)}
function toLocalInput(ts){const d=new Date(ts);return ymd(d)+'T'+hm(ts)}
const wa=t=>'https://wa.me/?text='+encodeURIComponent(t);
const SITE=()=>location.origin+location.pathname;
const uid=()=>Math.random().toString(36).slice(2,10);

/* ================= ESTADO ================= */
let db=null,AUTH=null,AUTHED=null,ME=null,FATAL=null,LOGINMODE='in';
const S={players:{},mine:{},loaded:false};COLS.forEach(c=>S[c]=[]);
let TAB='home',PLANSEG='quedadas',RECOCAT='todo',RECOFILT='todas',MASSUB=null,MODAL=null;

/* ================= JUGADORAS ================= */
function plist(){return Object.values(S.players).filter(p=>p.nick).sort((a,b)=>a.nick.localeCompare(b.nick))}
function ids(){return plist().map(p=>p.id)}
function nm(u){const p=S.players[u];return p&&p.nick?p.nick:'Alguien'}
function presetHasPhoto(k){const p=PRESETS.find(x=>x[0]===k);return p&&p[2]}
function photoSrc(u){const p=S.players[u];if(!p)return null;if(p.photo)return p.photo;if(p.avatar&&presetHasPhoto(p.avatar))return'fotos/'+p.avatar+'.jpg';return null}
function avHtml(src,label,size,kid){size=size||28;return src?`<img class="av${kid?' kid':''}" src="${esc(src)}" style="width:${size}px;height:${size}px" alt="">`:`<span class="av${kid?' kid':''}" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.45)}px">${esc((label||'?').trim().charAt(0).toUpperCase())}</span>`}
function av(u,size){return avHtml(photoSrc(u),nm(u),size)}
function avn(u,size){return av(u,size)+' '+esc(nm(u))}
function kidAv(k,size){return avHtml(k.photo,k.name,size,true)}
function kidById(id){return S.kids.find(k=>k.id===id)}
function forLabel(f){if(!f)return'';if(f.startsWith('u:'))return nm(f.slice(2));const k=kidById(f.slice(2));return k?k.name:'Alguien'}
function forAv(f,size){if(f.startsWith('u:'))return av(f.slice(2),size);const k=kidById(f.slice(2));return k?kidAv(k,size):avHtml(null,'?',size)}

/* ================= LÓGICA ================= */
function allDates(){
  const out=[];
  for(const p of plist())if(p.birth)out.push({kind:'cumple',key:'u:'+p.id,s:p.birth,title:'Cumple de '+p.nick,av:av(p.id,44),who:p.id,emoji:'🎂'});
  for(const k of S.kids)if(k.birth)out.push({kind:'kid',key:'k:'+k.id,s:k.birth,title:'Cumple de '+k.name,sub:'hij@ de '+nm(k.parent),av:kidAv(k,44),kid:k,emoji:'🎈'});
  for(const f of S.fechas)if(f.date){const t=F_TYPES.find(x=>x[0]===f.type)||F_TYPES[3];out.push({kind:'fecha',key:'f:'+f.id,s:f.date,title:f.title,sub:f.who?nm(f.who):'',av:f.who?av(f.who,44):`<span class="av" style="width:44px;height:44px;font-size:22px;background:var(--sun)">${t[1]}</span>`,f,emoji:t[1]})}
  out.forEach(o=>Object.assign(o,nextOcc(o.s)));
  return out.sort((a,b)=>a.days-b.days);
}
function attended(q,u){if(q.asist&&q.asist[u]!==undefined)return !!q.asist[u];return !!(q.rsvp&&q.rsvp[u]==='si')}
function rankQs(){const t=Math.min(RANK_TO,now());return S.quedadas.filter(q=>!q.cancel&&q.date&&q.date>=RANK_FROM&&q.date<=t).sort((a,b)=>a.date-b.date)}
function ranking(){
  const qs=rankQs();
  return plist().map(p=>{
    const el=qs.filter(q=>(p.joinedAt||0)<=q.date+864e5);
    let pts=0,racha=0,best=0,cur=0;el.forEach(q=>{if(attended(q,p.id)){pts++;cur++;best=Math.max(best,cur)}else cur=0});
    for(let i=el.length-1;i>=0;i--){if(attended(el[i],p.id))racha++;else break}
    return{id:p.id,pts,total:el.length,faltas:el.length-pts,racha,best,pct:el.length?Math.round(pts/el.length*100):0};
  }).sort((a,b)=>b.pts-a.pts||b.pct-a.pct||nm(a.id).localeCompare(nm(b.id)));
}
function recoScore(r){
  const vals=Object.values(r.ratings||{});let visits=0;
  for(const q of S.quedadas)if(q.recoId===r.id&&q.date&&q.date<=now()&&!q.cancel){visits++;vals.push(...Object.values(q.ratings||{}))}
  const n=vals.length;return{avg:n?vals.reduce((a,b)=>a+b,0)/n:0,n,visits};
}
function balances(list){const b={};ids().forEach(u=>b[u]=0);for(const g of list){const n=(g.among||[]).length;if(!n||!g.amount)continue;b[g.payer]=(b[g.payer]||0)+g.amount;g.among.forEach(u=>b[u]=(b[u]||0)-g.amount/n)}return b}
function settle(b){const d=[],c=[];for(const[u,v]of Object.entries(b)){if(v<-0.005)d.push([u,-v]);else if(v>0.005)c.push([u,v])}d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;while(i<d.length&&j<c.length){const a=Math.min(d[i][1],c[j][1]);out.push({from:d[i][0],to:c[j][0],amt:a});d[i][1]-=a;c[j][1]-=a;if(d[i][1]<0.005)i++;if(c[j][1]<0.005)j++}return out}
function curAward(){return[...S.awards].sort((a,b)=>b.year-a.year)[0]||null}
function pendingCount(){
  let n=0;
  for(const q of S.quedadas){if(q.cancel)continue;if(!q.date||q.date>now()){if(!q.rsvp||!q.rsvp[ME])n++;if(!q.date&&q.opts&&(!q.dvotes||!q.dvotes[ME]))n++}else if(q.recoId&&attended(q,ME)&&now()-q.date<14*864e5&&!(q.ratings&&q.ratings[ME]))n++}
  for(const e of S.encuestas)if(!e.closed&&!(e.votes&&e.votes[ME]!==undefined))n++;
  return n;
}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600)}
async function safe(fn,ok){try{const r=await fn();if(ok)toast(ok);return r}catch(e){console.warn(e);toast(e&&e.code==='permission-denied'?'Firebase no deja guardar (revisa las reglas)':'Ups, no se ha guardado. Prueba otra vez')}}
const D=p=>db.doc(p),C=c=>db.collection(c);
const DEL=()=>firebase.firestore.FieldValue.delete();
const upd=(p,o,ok)=>safe(()=>D(p).update(o),ok);
const add=(c,o,ok)=>safe(()=>C(c).add({...o,by:ME,at:now()}),ok);
const del=(p,ok)=>safe(()=>D(p).delete(),ok);

function vHaceUnAno(){

  if(!it.length)return'';
  return `<div class="sec h"><span>⏪ Tal día como hoy…</span></div><div class="card lilac">${it.sort((a,b)=>b[0]-a[0]).map(([ts,x])=>`<div class="item"><span class="pill lilac">${new Date(ts).getFullYear()}</span><span class="grow">${x}</span></div>`).join('')}</div>`;

function recoCard(r,s){

  ${r.note?`<p style="margin:6px 0">${esc(r.note)}</p>`:''}
  <div class="xs mut">Recomienda ${esc(nm(r.by))}${s.visits?` · 🍻 ${s.visits} quedada${s.visits===1?'':'s'} aquí`:''}</div>
  ${r.link?`<div class="sm" style="margin-top:4px"><a href="${esc(r.link)}" target="_blank" rel="noopener">${place?'📍 Ver en el mapa':'🔗 Ver enlace'}</a></div>`:''}
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px"><button class="btn sm ${likes.includes(ME)?'pink':'ghost'}" data-act="rlike" data-id="${r.id}">❤️ ${likes.length||''}</button><button class="btn sm ${done?'on':'ghost'}" data-act="rdone" data-id="${r.id}">${done?'✅ ':''}${place?'He ido':r.cat==='libro'?'Leído':'Visto'}</button>${r.by===ME?`<button class="btn sm ghost" data-act="rdel" data-id="${r.id}">🗑️</button>`:''}</div>
  ${done||r.by===ME?`<div style="margin-top:8px" class="sm"><b>Tu nota:</b> ${stars(my,'rrate',r.id)}</div>`:''}</div>`;

function gcal(q){const f=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const e=q.date+3*3600e3;return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(q.title)+'&dates='+f(q.date)+'/'+f(e)+'&location='+encodeURIComponent(q.place||'')+'&details='+encodeURIComponent((q.note||'')+'\n'+SITE())}
function ics(q){const f=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const t=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Friends//ES','BEGIN:VEVENT','UID:'+q.id+'@friends','DTSTAMP:'+f(now()),'DTSTART:'+f(q.date),'DTEND:'+f(q.date+3*3600e3),'SUMMARY:'+q.title.replace(/[,;]/g,' '),'LOCATION:'+(q.place||'').replace(/[,;]/g,' '),'DESCRIPTION:'+(q.note||'').replace(/\n/g,'\\n').replace(/[,;]/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download=(q.title||'quedada').replace(/[^\w\- ]/g,'')+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function readPhoto(file,size){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=size;c.getContext('2d').drawImage(img,(img.width-s)/2,Math.max(0,(img.height-s)/2-s*.08),s,s,0,0,size,size);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=url})}

    const reco=recoId?S.recos.find(r=>r.id===recoId):null;
    const ref=await safe(()=>C('quedadas').add({title:v('title'),type,date,opts,recoId,place:place||(reco?reco.title:''),maps:maps||(reco&&reco.link)||'',note:v('note'),rsvp:{[ME]:'si'},by:ME,at:now()}),'📅 ¡Quedada creada!');
    if(ref){closeM();TAB='planes';PLANSEG='quedadas';renderAll();openM('q',ref.id)}return}
  if(name==='item'){const k=uid();await upd('quedadas/'+f.dataset.id,{['items.'+k]:{text:v('text'),who:null,at:now()}});f.reset();return}
  if(name==='newe'){const opts=v('opts').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);if(opts.length<2)return toast('Pon al menos 2 opciones');await add('encuestas',{q:v('q'),opts,votes:{},closed:false},'🗳️ Encuesta creada');closeM();TAB='planes';PLANSEG='encuestas';renderAll();return}
  if(name==='newv'){const ref=await add('viajes',{dest:v('dest'),from:v('from')||null,to:v('to')||null,aloj:v('aloj'),link:v('link'),note:v('note'),rsvp:{[ME]:'si'},check:{}},'✈️ ¡Viaje creado!');if(ref){closeM();TAB='planes';PLANSEG='viajes';renderAll();openM('v',ref.id)}return}
  if(name==='vck'){const k=uid();await upd('viajes/'+f.dataset.id,{['check.'+k]:{text:v('text'),done:false,at:now()}});f.reset();return}
  if(name==='wish'){await add('wishes',{for:f.dataset.k,text:v('text'),link:v('link'),got:false},'🎁 Idea apuntada');f.reset();return}
  if(name==='bote'){await safe(()=>D('botes/'+f.dataset.bid).set({for:f.dataset.k,amount:+v('amount'),org:v('org'),paid:{},by:ME,at:now()}),'💸 Bote creado');return}
  if(name==='kid'){const parent=v('parent');if(!parent)return toast('Elige de quién es');const o={name:v('name'),birth:v('birth'),parent};const file=f.elements.photo.files[0];if(file){try{o.photo=await readPhoto(file,200)}catch(x){}}
    if(f.dataset.id)await upd('kids/'+f.dataset.id,o,'Guardado');else await add('kids',o,'🎈 ¡Añadido!');closeM();return}
  if(name==='fecha'){await add('fechas',{type:v('type'),title:v('title'),date:v('date'),who:v('who')||null},'⭐ Fecha guardada');closeM();TAB='fechas';renderAll();return}
  if(name==='reco'){const o={cat:v('cat'),title:v('title'),note:v('note'),link:v('link')};if(v('rating'))o.ratings={[ME]:+v('rating')};await add('recos',o,'⭐ ¡Recomendado!');closeM();RECOCAT='todo';RECOFILT='todas';TAB='recos';renderAll();return}
  if(name==='gasto'){const among=v('among').split(',').filter(Boolean),payer=v('payer'),amount=Math.round(parseFloat(v('amount').replace(',','.'))*100)/100;if(!payer)return toast('¿Quién pagó?');if(!among.length)return toast('Elige entre quiénes');if(!(amount>0))return toast('Importe no válido');const o={kind:'gasto',desc:v('desc'),amount,payer,among};if(f.dataset.viaje)o.viaje=f.dataset.viaje;await add('gastos',o,'💰 Gasto guardado');closeM();return}
  if(name==='pago'){const to=v('to'),amount=Math.round(parseFloat(v('amount').replace(',','.'))*100)/100;if(!to)return toast('¿A quién?');if(!(amount>0))return toast('Importe no válido');await add('gastos',{kind:'pago',desc:'Pago',amount,payer:ME,among:[to]},'💸 Pago registrado');closeM();return}
  if(name==='cap'){const t=v('text'),when=new Date(v('when')).getTime();if(when<=now())return toast('Elige una fecha futura');await add('capsula',{text:t,len:t.length,openAt:when},'💌 Guardado en la cápsula');closeM();return}
  if(name==='frase'){if(!v('who'))return toast('¿Quién la dijo?');await add('frases',{text:v('text'),who:v('who')},'💬 Frase guardada');closeM();return}
  if(name==='confes'){const ref=C('confes').doc();const mine=(S.mine&&S.mine.confes)||[];await safe(async()=>{await D('data/users/'+ME+'/me').set({confes:[...mine,ref.id].slice(-50)},{merge:true});await ref.set({text:v('text'),at:now()})},'🤫 Enviado en secreto');closeM();return}
  if(name==='aw'){const cats=v('cats').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,15);if(!cats.length)return toast('Pon alguna categoría');await safe(()=>D('awards/'+f.dataset.y).set({year:+f.dataset.y,cats,revealAt:new Date(v('when')).getTime(),by:ME,at:now()}),'🏅 ¡Votaciones abiertas!');closeM();TAB='mas';MASSUB='awards';renderAll();return}
  if(name==='awdate'){const aw=curAward();await upd('awards/'+aw.year,{revealAt:new Date(v('when')).getTime()},'Fecha cambiada');return}
  }finally{if(btn)btn.disabled=false}
}

/* ================= LOGIN / REGISTRO ================= */
const AUTHERR={'auth/invalid-credential':'Email o contraseña incorrectos','auth/wrong-password':'Contraseña incorrecta','auth/user-not-found':'No hay ninguna cuenta con ese email. Dale a «Crear cuenta»','auth/email-already-in-use':'Ya existe una cuenta con ese email. Dale a «Entrar»','auth/weak-password':'La contraseña tiene que tener al menos 6 caracteres','auth/invalid-email':'Ese email no es válido','auth/too-many-requests':'Demasiados intentos. Espera un poco','auth/network-request-failed':'Sin conexión 📶','auth/missing-password':'Pon la contraseña'};
const authMsg=e=>AUTHERR[e&&e.code]||'Algo ha fallado. Prueba otra vez';
async function doLogin(f){const email=f.elements.email.value.trim(),pass=f.elements.pass.value;try{if(LOGINMODE==='up'){if(pass!==f.elements.pass2.value)return toast('Las contraseñas no coinciden');await AUTH.createUserWithEmailAndPassword(email,pass)}else await AUTH.signInWithEmailAndPassword(email,pass)}catch(e){console.warn(e);toast(authMsg(e))}}
async function doResetPass(){const f=document.querySelector('form[data-form=login]');const email=f?f.elements.email.value.trim():'';if(!email)return toast('Escribe tu email arriba y vuelve a pulsar');try{await AUTH.sendPasswordResetEmail(email);toast('📧 Te hemos mandado un email (mira en spam)')}catch(e){toast(authMsg(e))}}
function vLogin(){const up=LOGINMODE==='up';return `<div class="card hero"><div class="big">Friends<i>.</i></div><p>Cumples, quedadas, recomendaciones y todo lo nuestro, en un solo sitio 💛</p></div>
  <form class="card" data-form="login"><div class="h ttl coral">${up?'✨ Crea tu cuenta':'🔑 Entra'}</div><label>Email</label><input name="email" type="email" autocomplete="email" required placeholder="tu@email.com"><label>Contraseña</label><input name="pass" type="password" autocomplete="${up?'new-password':'current-password'}" required minlength="6" placeholder="${up?'Mínimo 6 caracteres':'Tu contraseña'}">${up?'<label>Repite la contraseña</label><input name="pass2" type="password" autocomplete="new-password" required minlength="6">':''}
  <button class="btn coral full">${up?'Crear cuenta':'Entrar'}</button><button type="button" class="btn ghost full" data-act="loginmode">${up?'Ya tengo cuenta → Entrar':'Es mi primera vez → Crear cuenta'}</button>${up?'':'<p class="center sm"><a href="#" data-act="resetpass" style="color:var(--mut)">¿Olvidaste la contraseña?</a></p>'}</form>`}
function vRegister(){const prev=S.players[ME]||{};const taken=new Set(Object.values(S.players).filter(p=>p.id!==ME&&p.avatar).map(p=>p.avatar));const cur=prev.avatar||'';
  return `<div class="card hero"><div class="h" style="font-size:18px">Bienvenida a</div><div class="big">Friends<i>.</i></div></div>
  <form class="card" data-form="reg"><div class="h ttl coral">¿Quién eres?</div><input type="hidden" name="avatar" value="${esc(cur)}"><div class="pick">${PRESETS.map(([k,n,ph])=>`<button type="button" class="${cur===k?'on':''} ${taken.has(k)?'taken':''}" data-act="pick" data-k="${k}" data-n="${n}">${ph?`<img src="fotos/${k}.jpg" alt="">`:`<span class="noimg">${n[0]}</span>`}${n}</button>`).join('')}</div>
  <label>Tu nombre</label><input name="nick" maxlength="20" required value="${esc(prev.nick||'')}"><label>Tu cumpleaños</label><input type="date" name="birth" value="${esc(prev.birth||'')}"><div class="xs mut" style="margin-top:-6px;margin-bottom:8px">Solo se verá el día y el mes 😉 Podrás cambiar tu foto desde tu perfil.</div><button class="btn coral full">Entrar 💛</button></form>`}

/* ================= RENDER ================= */
const NAVI={"home": '<svg viewBox=\"0 0 24 24\"><path d=\"M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"/></svg>', "planes": '<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M16 3v4M8 3v4M3 10h18\"/></svg>', "fechas": '<svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/><path d=\"M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8C10 5 8 3.5 7 4.5S7.5 8 12 8zm0 0c2-3 4-4.5 5-3.5S16.5 8 12 8z\"/></svg>', "recos": '<svg viewBox=\"0 0 24 24\"><path d=\"m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z\"/></svg>', "mas": '<svg viewBox=\"0 0 24 24\"><path d=\"M4 7h16M4 12h16M4 17h16\"/></svg>'};
function viewKey(){if(FATAL)return'fatal';if(AUTHED===false)return'login';if(!S.loaded)return'loading';if(!S.players[ME]||!S.players[ME].nick)return'register';return TAB}
function renderAll(){
  const k=viewKey(),m=$('#main');
  const inMain=document.activeElement&&m.contains(document.activeElement)&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!(inMain&&(k==='login'||k==='register')&&m.dataset.key===k)){
    m.dataset.key=k;
    m.innerHTML=k==='fatal'?`<div class="card center"><div style="font-size:48px">😵</div><p>${esc(FATAL)}</p></div>`:k==='loading'?`<div class="card center"><div style="font-size:48px">💛</div><p id="loadmsg">Cargando…</p></div>`:k==='login'?vLogin():k==='register'?vRegister():({home:vHome,planes:vPlanes,fechas:vFechas,recos:vRecos,mas:vMas}[k]||vHome)();
  }
  const inApp=!['fatal','loading','login','register'].includes(k);
  $('#mechip').innerHTML=inApp?`<div class="mechip" data-act="profile">${av(ME,28)} ${esc(nm(ME))}</div>`:'';
  const pc=inApp?pendingCount():0;
  $('#nav').innerHTML=inApp?`<div class="in">${[['home','Inicio'],['planes','Planes'],['fechas','Fechas'],['recos','Recos'],['mas','Más']].map(([v,l])=>`<button class="${TAB===v?'on':''}" data-act="tab" data-v="${v}">${NAVI[v]}${l}${v==='home'&&pc?`<span class="badge">${pc}</span>`:''}</button>`).join('')}</div>`:'';
  renderModal();
}
let rt=null;function changed(){clearTimeout(rt);rt=setTimeout(renderAll,60)}
setInterval(()=>{if(S.loaded&&!MODAL&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))renderAll()},60000);

/* ================= ARRANQUE ================= */
async function init(){
  renderAll();
  const cfg=window.FIREBASE_CONFIG||{};
  if(!window.firebase||!cfg.apiKey||/PEGA/.test(cfg.apiKey)){FATAL='Falta configurar Firebase en config.js.';renderAll();return}
  try{firebase.initializeApp(cfg);AUTH=firebase.auth();db=firebase.firestore()}catch(e){console.warn(e);FATAL='La configuración de Firebase no es correcta.';renderAll();return}
  AUTH.onAuthStateChanged(u=>{if(!u){AUTHED=false;renderAll();return}if(AUTHED&&ME===u.uid)return;AUTHED=true;ME=u.uid;startData()});
}
function startData(){
  renderAll();
  const timer=setTimeout(()=>{if(!S.loaded){const el=$('#loadmsg');if(el)el.textContent='No consigo conectar… revisa tu conexión 📶'}},10000);
  const err=e=>{console.warn('db',e);if(e&&e.code==='permission-denied'){clearTimeout(timer);FATAL='Firebase no deja leer los datos: revisa las reglas de Firestore.';renderAll()}};
  C('players').onSnapshot(s=>{const P={};s.docs.forEach(d=>P[d.id]={id:d.id,...d.data()});S.players=P;if(!S.loaded){S.loaded=true;clearTimeout(timer)}changed()},err);
  COLS.forEach(c=>C(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));changed()},err));
  D('data/users/'+ME+'/me').onSnapshot(s=>{S.mine=s.exists?s.data():{};changed()},err);
}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
