function siren(){for(let i=0;i<4;i++)setTimeout(()=>tone('sawtooth',550,1150,.28,.13),i*300);try{navigator.vibrate&&navigator.vibrate([300,120,300,120,300])}catch(e){}document.body.classList.remove('flash');void document.body.offsetWidth;document.body.classList.add('flash')}
function ding(){tone('triangle',880,1760,.18,.2);setTimeout(()=>tone('triangle',1320,2200,.2,.15),110)}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2600)}

/* ===================== LÓGICA ===================== */
function plist(){return Object.values(S.players).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||a.id.localeCompare(b.id))}
function ids(){return plist().map(p=>p.id)}
function nm(u){const p=S.players[u];return p?p.nick:'Alguien'}
function photoSrc(u){const p=S.players[u];if(!p)return null;if(p.photo)return p.photo;if(p.avatar)return 'fotos/'+p.avatar+'.jpg';return null}
function av(u,size){const s=photoSrc(u),p=S.players[u];size=size||28;return s?`<img class="av" src="${esc(s)}" style="width:${size}px;height:${size}px" alt="">`:`<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.6)}px">${esc(p&&p.nick?p.nick.trim().charAt(0).toUpperCase():'?')}</span>`}
function avn(u,size){return av(u,size)+' '+esc(S.players[u]?S.players[u].nick:'Alguien')}
function started(){return !!(S.game&&S.game.startedAt)}
function levelOf(n){let i=0;LEVELS.forEach((l,j)=>{if(n>=l[0])i=j});return i}
const okDrink=e=>e.kind==='drink'&&e.ok==='si';
function drinksBefore(t){let n=0;for(const e of S.events)if(okDrink(e)&&e.at<=t)n++;return n}
function totalDrinks(){return S.events.filter(okDrink).length}

function missionOf(u){
  if(!started())return null;const L=plist();const i=L.findIndex(p=>p.id===u);if(i<0)return null;
  const r=rng(hash('mis'+S.game.startedAt));const idx=MISIONES.map((_,k)=>k);
  for(let j=idx.length-1;j>0;j--){const k=Math.floor(r()*(j+1));[idx[j],idx[k]]=[idx[k],idx[j]]}
  return MISIONES[idx[i%idx.length]];
}
function finInfo(){const n=ids().length;const need=Math.max(1,Math.ceil(n/2));const f=[...S.fin].sort((a,b)=>a.at-b.at);const on=f.length>=need;return{need,count:f.length,on,at:on?f[need-1].at:null,mine:f.some(x=>x.id===ME)}}

function schedule(){
  if(!started())return[];
  const start=S.game.startedAt,fi=finInfo(),until=Math.min(Date.now(),fi.on?fi.at:Infinity);
  const r=rng(hash('sch'+start));const out=[];let t=Math.max(start+7*60e3,RETOS_AT),k=0,last=null;const usedR=new Set(),usedQ=new Set();
  while(t<=until&&k<60){
    const a=r(),b=r(),c=r();
    const us=plist().filter(p=>(p.joinedAt||0)<=t).map(p=>p.id);
    if(k%2===0){
      const lvl=levelOf(drinksBefore(t-60e3))+1;
      let pool=RETOS.map((_,i)=>i).filter(i=>RETOS[i].l<=lvl&&RETOS[i].l>=lvl-1&&!usedR.has(i));
      if(!pool.length)pool=RETOS.map((_,i)=>i).filter(i=>RETOS[i].l<=lvl);
      const ri=pool[Math.floor(b*pool.length)];usedR.add(ri);
      let cand=us.filter(x=>x!==last);if(!cand.length)cand=us;
      const target=cand.length?cand[Math.floor(a*cand.length)]:null;last=target;
      if(target)out.push({id:'slot'+k,kind:'reto',target,text:RETOS[ri].t,lvl,at:t,endsAt:t+6*60e3});
    }else{
      let pool=QUIEN.map((_,i)=>i).filter(i=>!usedQ.has(i));if(!pool.length){usedQ.clear();pool=QUIEN.map((_,i)=>i)}
      const qi=pool[Math.floor(b*pool.length)];usedQ.add(qi);
      if(us.length>=1)out.push({id:'slot'+k,kind:'quien',text:QUIEN[qi],at:t,endsAt:t+150e3});
    }
    t+=(9+Math.floor(c*6))*60e3;k++;
  }
  return out;
}
function allPolls(){return[...schedule(),...S.polls].sort((a,b)=>a.at-b.at)}
function castigo(p){return CASTIGOS[hash(p.id+'castigo')%CASTIGOS.length]}

function pollInfo(p){
  const all=ids();const vs=S.votes.filter(v=>v.poll===p.id);
  const elig=p.kind==='quien'?all:all.filter(u=>u!==p.target);
  const valid=vs.filter(v=>elig.includes(v.uid));
  const allIn=elig.length>0&&elig.every(u=>valid.some(v=>v.uid===u));
  const closed=Date.now()>p.endsAt||allIn;
  const mv=vs.find(v=>v.uid===ME);const myVote=mv?mv.choice:null;
  const canVote=!closed&&elig.includes(ME);
  const tally={};valid.forEach(v=>tally[v.choice]=(tally[v.choice]||0)+1);
  let verdict=null;
  if(p.kind!=='quien'){const si=tally.si||0,no=tally.no||0;if(si+no>0)verdict=p.kind==='juicio'?(si>no?'si':'no'):(si>=no?'si':'no')}
  return{closed,myVote,canVote,verdict,tally,n:valid.length,elig:elig.length};
}

function compute(){
  const U=ids();const st={};
  U.forEach(u=>st[u]={pts:0,by:{},tramp:0,drinks:0,cana:0,vino:0,copa:0,chupito:0,risas:0,frases:0,retoOk:0,retoKo:0,culp:0,falsas:0,mision:null,pillada:false,detect:0,quien:0,fraseTop:0});
  const add=(u,p,cat)=>{if(!st[u])return;st[u].pts+=p;st[u].by[cat]=(st[u].by[cat]||0)+p};
  for(const e of S.events){
    if(okDrink(e)&&st[e.to]){add(e.to,PTS[e.sub]||1,'🍻');st[e.to].drinks++;st[e.to][e.sub]=(st[e.to][e.sub]||0)+1}
    else if(e.kind==='drink'&&e.ok==='no'&&st[e.to]){add(e.to,-2,'🤥');st[e.to].tramp++}
    else if(e.kind==='risa'&&st[e.to]){add(e.to,5,'😂');st[e.to].risas++}
  }
  for(const f of S.frases)if(st[f.who]){add(f.who,2,'💬');st[f.who].frases++}
  const polls=allPolls();
  for(const p of polls){
    const i=pollInfo(p);if(!i.closed)continue;
    if(p.kind==='reto'&&i.verdict){if(i.verdict==='si'){add(p.target,5,'🎲');st[p.target]&&st[p.target].retoOk++}else{add(p.target,-3,'🎲');st[p.target]&&st[p.target].retoKo++}}
    if(p.kind==='juicio'&&i.verdict){if(i.verdict==='si'){add(p.target,-3,'⚖️');st[p.target]&&st[p.target].culp++}else{add(p.by,-2,'⚖️');st[p.by]&&st[p.by].falsas++}}
    if(p.kind==='mision'&&st[p.target]){if(i.verdict==='si'){add(p.target,15,'🕵️');st[p.target].mision='ok'}else if(i.verdict==='no')st[p.target].mision='ko'}
    if(p.kind==='quien')for(const[u,n]of Object.entries(i.tally))if(st[u])st[u].quien+=n;
  }
  for(const a of S.accus){
    if(a.answer==='si'){add(a.by,8,'🕵️');st[a.by]&&st[a.by].detect++;if(st[a.target])st[a.target].pillada=true}
    else if(a.answer==='no')add(a.by,-1,'🕵️');
  }
  for(const c of S.confes)if(c.revealedBy){for(const v of S.votes)if(v.poll==='conf_'+c.id&&v.choice===c.revealedBy&&v.uid!==c.revealedBy)add(v.uid,3,'🤫')}
  const fin=finInfo();
  if(fin.on&&S.frases.length){
    const t={};S.votes.filter(v=>v.poll==='frase_final').forEach(v=>t[v.choice]=(t[v.choice]||0)+1);
    const mx=Math.max(0,...Object.values(t));
    if(mx>0)S.frases.filter(f=>t[f.id]===mx).forEach(f=>{add(f.who,15,'⭐');st[f.who]&&st[f.who].fraseTop++});
  }
  const rank=U.map(u=>({id:u,...st[u]})).sort((a,b)=>b.pts-a.pts||b.drinks-a.drinks);
  return{st,rank,polls,fin};
}

/* ===================== ACCIONES (escrituras) ===================== */
async function safe(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg)}
  catch(e){console.warn(e);if(e&&e.code==='permission-denied'){toast('Firebase no deja guardar: revisa las reglas de Firestore')}else if(e&&e.code==='resource-exhausted'){toast('Se ha llenado el plan gratis de Firebase por hoy 😬')}else toast('Ups, no se ha guardado. Prueba otra vez')}
}
const now=()=>Date.now();
async function addDrink(k){unlock();ding();const solo=ids().length<=1;await safe(()=>db.collection('events').add({kind:'drink',sub:k,to:ME,by:ME,at:now(),ok:solo?'si':null,okBy:solo?ME:null}),solo?DRINKS.find(d=>d.k===k).e+' ¡+'+PTS[k]+'!':DRINKS.find(d=>d.k===k).e+' Apuntada. Ahora otra tiene que validarla 👀')}
async function checkDrink(id,c){await safe(()=>db.doc('events/'+id).update({ok:c,okBy:ME,okAt:now()}),c==='si'?'✅ Validada':'🚫 ¡Pillada intentando colarla! −2')}
function myLastDrink(){const m=S.events.filter(e=>e.kind==='drink'&&e.by===ME&&e.ok!=='no'&&(!e.ok||now()-e.at<120e3)).sort((a,b)=>b.at-a.at);return m[0]||null}
async function undoDrink(){const l=myLastDrink();if(l)await safe(()=>db.doc('events/'+l.id).delete(),'Deshecho ↩️')}
function risaCooldown(){const m=S.events.filter(e=>e.kind==='risa'&&e.by===ME).sort((a,b)=>b.at-a.at)[0];return m?Math.max(0,m.at+180e3-now()):0}
async function giveRisa(u){closeModal();await safe(()=>db.collection('events').add({kind:'risa',to:u,by:ME,at:now()}),'😂 +5 para '+nm(u))}
async function vote(pid,choice){await safe(()=>db.doc('votes/'+pid+'__'+ME).set({poll:pid,uid:ME,choice,at:now()}),'Voto registrado 🗳️')}
async function startGame(){await safe(async()=>{const r=db.doc('game/state');const s=await r.get();if(!s.exists||!s.data().startedAt)await r.set({startedAt:now()})});siren()}
async function claimMission(){const m=missionOf(ME);await safe(()=>db.collection('polls').add({kind:'mision',target:ME,by:ME,text:m,at:now(),endsAt:now()+120e3}),'¡Que vote la mesa! 🕵️')}
async function answerAccus(id,c){await safe(()=>db.doc('accus/'+id).update({answer:c,answeredAt:now()}),c==='si'?'Pillada 🙈':'¡Frío, frío! 🥶')}
async function toggleFin(){const f=finInfo();if(f.on)return;await safe(()=>f.mine?db.doc('fin/'+ME).delete():db.doc('fin/'+ME).set({at:now()}),f.mine?'Vale, seguimos 🍻':'Has pedido la cuenta 🧾')}
async function unmask(id){await safe(()=>db.doc('confes/'+id).update({revealedBy:ME}),'🙋‍♀️ ¡Destapada!')}
async function delFrase(id){await safe(()=>db.doc('frases/'+id).delete(),'Frase borrada')}

async function doReset(){
  closeModal();toast('Reiniciando…');
  for(const c of['events','frases','polls','votes','accus','confes','fin']){
    try{const s=await db.collection(c).get();for(const d of s.docs){await db.doc(c+'/'+d.id).delete();await sleep(60)}}catch(e){console.warn(e)}
  }
  try{await db.doc('game/state').delete()}catch(e){}
  try{localStorage.removeItem('cc_seen')}catch(e){}SEEN=new Set();RANKSTEP=null;
  toast('Partida reiniciada ✅');
}

async function formSubmit(name,f){
  unlock();if(name==='login')return doLogin(f);const v=n=>(f.elements[n]?f.elements[n].value:'').trim();
  if(name==='reg'){
    const nick=v('nick').slice(0,20),avatar=v('avatar')||null;if(!nick)return toast('Pon tu apodo');
    const prev=S.players[ME];
    if(avatar&&Object.values(S.players).some(p=>p.id!==ME&&p.avatar===avatar))return toast('Esa foto ya la ha cogido otra 👀');
    await safe(()=>db.doc('players/'+ME).set({nick,avatar,photo:prev&&prev.photo||null,joinedAt:prev&&prev.joinedAt?prev.joinedAt:now()}),'¡Dentro! 🍻');
  }
  if(name==='juicio'){
    const target=v('target');let crime=v('crime');if(crime==='__otro')crime=v('otro');
    if(!target)return toast('Toca a quién denuncias');if(!crime)return toast('Elige el delito');
    const lastJ=S.polls.filter(p=>p.kind==='juicio'&&p.by===ME).sort((a,b)=>b.at-a.at)[0];
    if(lastJ&&now()-lastJ.at<120e3)return toast('Espera '+mmss(lastJ.at+120e3-now())+' para otro juicio, chivata');
    await safe(()=>db.collection('polls').add({kind:'juicio',target,by:ME,text:crime.slice(0,140),at:now(),endsAt:now()+120e3}),'⚖️ ¡Que empiece el juicio!');
    f.reset();f.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  }
  if(name==='accus'){
    const target=v('target'),guess=v('guess');if(!target||!guess)return toast('Elige a quién y escribe tu sospecha');
    if(S.accus.some(a=>a.by===ME&&a.target===target))return toast('Ya acusaste a '+nm(target)+'. Solo una bala por persona 🔫');
    await safe(()=>db.collection('accus').add({by:ME,target,guess:guess.slice(0,140),at:now(),answer:null}),'🕵️ Acusación enviada');f.reset();f.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  }
  if(name==='frase'){
    const text=v('text'),who=v('who');if(!text||!who)return toast('Escribe la frase y quién la dijo');
    await safe(()=>db.collection('frases').add({text:text.slice(0,200),who,by:ME,at:now()}),'💬 Frase épica guardada (+2 para '+nm(who)+')');f.reset();
  }
  if(name==='confes'){
    const text=v('text');if(!text)return;
    await safe(async()=>{const ref=db.collection('confes').doc();const mine=(S.mine&&S.mine.confes)||[];await db.doc('data/users/'+ME+'/me').set({...(S.mine||{}),confes:[...mine,ref.id].slice(-50)});await ref.set({text:text.slice(0,300),at:now()})},'🤫 Confesión enviada en secreto');f.reset();
  }
}

async function act(a,d,el){
  if(a==='loginmode'){LOGINMODE=LOGINMODE==='up'?'in':'up';renderAll(true);return}
  if(a==='resetpass')return doResetPass();
  if(a==='logout'){try{await AUTH.signOut()}catch(e){}location.reload();return}
  if(a==='tpick'){const f=el.closest('form');f.querySelectorAll('[data-act=tpick]').forEach(b=>b.classList.toggle('on',b===el));f.elements.target.value=d.u;return}
  unlock();
  if(a==='tab'){TAB=d.v;window.scrollTo(0,0);renderAll(true);return}
  if(a==='pick'){document.querySelectorAll('.pick button').forEach(b=>b.classList.toggle('on',b.dataset.k===d.k));const f=document.querySelector('form[data-form=reg]');if(f){f.elements.avatar.value=d.k;if(d.n&&!f.elements.nick.value.trim()||d.n&&PRESETS.some(p=>p[1]===f.elements.nick.value.trim()))f.elements.nick.value=d.n}return}
  if(a==='photo'){return openModal(`<div class="h ttl gold">📸 TU FOTO</div><div class="center">${av(ME,140)}</div><label class="btn full" style="text-align:center">📷 Subir otra foto<input type="file" accept="image/*" id="photofile" style="display:none"></label>${S.players[ME]&&S.players[ME].photo&&S.players[ME].avatar?'<button class="btn ghost full" data-act="photoreset">↩️ Volver a la foto original</button>':''}<button class="btn ghost full" data-act="close">Cerrar</button>`)}
  if(a==='photoreset'){closeModal();return safe(()=>db.doc('players/'+ME).update({photo:null}),'Foto original de vuelta 😈')}
  if(a==='drink')return addDrink(d.k);
  if(a==='chk')return checkDrink(d.id,d.c);
  if(a==='undo')return undoDrink();
  if(a==='risa'){const cd=risaCooldown();if(cd)return toast('Calma, guapa: puedes dar otra risa en '+mmss(cd));
    return openModal(`<div class="h ttl gold">😂 ¿QUIÉN TE HA HECHO MEARTE?</div><p class="mut sm">+5 puntos para ella. Una cada 3 minutos.</p><div class="chips">${plist().filter(p=>p.id!==ME).map(p=>`<button class="chip" data-act="risaTo" data-u="${esc(p.id)}">${avn(p.id,30)}</button>`).join('')}</div><button class="btn ghost full" data-act="close">Cancelar</button>`)}
  if(a==='risaTo')return giveRisa(d.u);
  if(a==='close')return closeModal();
  if(a==='vote')return vote(d.p,d.c);
  if(a==='start')return startGame();
  if(a==='mis'){SHOWMIS=!SHOWMIS;renderAll();return}
  if(a==='claim')return claimMission();
  if(a==='ans')return answerAccus(d.id,d.c);
  if(a==='fin')return toggleFin();
  if(a==='unmask')return unmask(d.id);
  if(a==='delfrase')return delFrase(d.id);
  if(a==='dismiss'){SEEN.add('x'+d.id);saveSeen();renderAll();return}
  if(a==='next'){const n=compute().rank.length;RANKSTEP=RANKSTEP===null?n-1:Math.max(0,RANKSTEP-1);siren();renderAll();return}
  if(a==='copy'){const t=$('#wrapped')?$('#wrapped').textContent:'';try{await navigator.clipboard.writeText(t);toast('Copiado: pégalo en el grupo 📲')}catch(e){const r=document.createRange();r.selectNodeContents($('#wrapped'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Selecciona y copia el texto')}return}
  if(a==='reset')return openModal(`<div class="h ttl red">⚠️ REINICIAR PARTIDA</div><p>Se borran bebidas, frases, votos, juicios, confesiones… todo menos las jugadoras registradas. No se puede deshacer.</p><div class="yn"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn red" data-act="doreset">Borrar todo</button></div>`);
  if(a==='doreset')return doReset();
}

const LABELS={reto:['✅ Lo ha hecho','❌ Ni de coña'],juicio:['🔨 Culpable','😇 Inocente'],mision:['✅ Cumplida','❌ Mentira']};
function pollCard(p,i,isAlert){
  let h='',cls='card';
  if(isAlert)cls+=' alert';
  if(p.target&&p.kind!=='quien')h+=`<div style="float:right;margin-left:8px">${av(p.target,58)}</div>`;
  if(p.kind==='reto')h+=`<div class="h ttl red">🎲 RETO PARA ${esc(nm(p.target)).toUpperCase()}</div><span class="tag">NIVEL ${p.lvl}</span><div class="qt">${esc(p.text)}</div>`;
  if(p.kind==='quien')h+=`<div class="h ttl gold">🗳️ ¿QUIÉN DE LA MESA…?</div><div class="qt">${esc(p.text)}</div>`;
  if(p.kind==='juicio')h+=`<div class="h ttl red">⚖️ JUICIO A ${esc(nm(p.target)).toUpperCase()}</div><div class="sm mut">Denuncia de ${esc(nm(p.by))}</div><div class="qt">«${esc(p.text)}»</div>`;
  if(p.kind==='mision')h+=`<div class="h ttl green">🕵️ ${esc(nm(p.target)).toUpperCase()} DICE QUE HA CUMPLIDO SU MISIÓN</div><div class="qt">«${esc(p.text)}»</div>`;
  if(!i.closed){
    h+=`<div class="sm mut">Quedan <span class="cd" data-ends="${p.endsAt}">${mmss(p.endsAt-now())}</span> · ${i.n}/${i.elig} votos</div>`;
    if(p.kind==='reto'&&p.target===ME)h+=`<p><b>🔥 ¡TE TOCA!</b> Hazlo antes de que acabe el tiempo. La mesa vota. Si no: −3 y castigo.</p>`;
    if(p.kind==='juicio'&&p.target===ME)h+=`<p><b>Te están juzgando.</b> Defiéndete como puedas 🙃</p>`;
    if(p.kind==='mision'&&p.target===ME)h+=`<p class="mut">La mesa está votando si te lo creen…</p>`;
    if(i.canVote){

function pendingItems(C){
  const out=[];
  for(const p of C.polls){
    const i=pollInfo(p);
    if(!i.closed){
      if((p.kind==='reto'||p.kind==='juicio')&&p.target===ME)out.push({id:p.id+'_t',html:pollCard(p,i,true)});
      else if(i.canVote&&i.myVote==null)out.push({id:p.id,html:pollCard(p,i,true)});
    }else if(now()-p.endsAt<120e3&&!SEEN.has('x'+p.id)&&(p.kind!=='mision'||true)){
      out.push({id:'r'+p.id,res:true,html:`<div class="card res"><button class="x" data-act="dismiss" data-id="${p.id}">✕</button>${pollCard(p,i,false).replace(/^<div class="card">|<\/div>$/g,'')}</div>`});
    }
  }
  for(const a of S.accus)if(a.target===ME&&!a.answer)out.push({id:'a'+a.id,html:accusCard(a,true)});
  for(const e of S.events)if(e.kind==='drink'&&!e.ok&&e.to!==ME){const d=DRINKS.find(x=>x.k===e.sub)||DRINKS[0];
    out.push({id:'d'+e.id,chk:true,html:`<div class="card chk">${av(e.to,40)}<span class="t">${esc(nm(e.to))} dice que se ha pedido ${d.e} <span class="sm mut">${d.n.toLowerCase()} · ${fmtT(e.at)}</span><br><span class="sm mut">¿Es verdad?</span></span><button class="btn green sm" data-act="chk" data-id="${e.id}" data-c="si">Sí</button><button class="btn red sm" data-act="chk" data-id="${e.id}" data-c="no">Mentira</button></div>`})}
  return out;
}

function feedItems(C){
  const it=[];
  for(const e of S.events){
    if(e.kind==='drink'&&e.ok==='no'){const d=DRINKS.find(x=>x.k===e.sub)||DRINKS[0];it.push([e.okAt||e.at,`🤥 <b>${esc(nm(e.to))}</b> ha intentado colar ${d.e} y ${esc(nm(e.okBy))} la ha pillado (−2)`])}
    if(okDrink(e)){const d=DRINKS.find(x=>x.k===e.sub)||DRINKS[0];it.push([e.at,`${d.e} <b>${esc(nm(e.to))}</b> se pide ${d.k==='copa'?'una copa':d.k==='cana'?'una caña':d.k==='vino'?'un vino':'un chupito'} (+${PTS[e.sub]})`])}
    if(e.kind==='risa')it.push([e.at,`😂 <b>${esc(nm(e.by))}</b> se ha meado de risa con <b>${esc(nm(e.to))}</b> (+5)`]);
  }
  for(const f of S.frases)it.push([f.at,`💬 <b>${esc(nm(f.who))}</b>: <i>«${esc(f.text)}»</i>`]);
  for(const p of C.polls){const i=pollInfo(p);if(!i.closed)continue;const t=Math.min(p.endsAt,now());
    if(p.kind==='reto')it.push([t,i.verdict==='si'?`🎲 <b>${esc(nm(p.target))}</b> supera su reto (+5)`:i.verdict==='no'?`🎲 <b>${esc(nm(p.target))}</b> se raja en su reto: −3 y castigo`:`🎲 Reto de ${esc(nm(p.target))} sin votos`]);
    if(p.kind==='juicio'&&i.verdict)it.push([t,i.verdict==='si'?`⚖️ <b>${esc(nm(p.target))}</b> declarada CULPABLE de «${esc(p.text)}»`:`⚖️ <b>${esc(nm(p.target))}</b> absuelta. ${esc(nm(p.by))} pierde 2 por chivata`]);
    if(p.kind==='mision'&&i.verdict==='si')it.push([t,`🕵️ <b>${esc(nm(p.target))}</b> ¡cumple su misión secreta! (+15)`]);
    if(p.kind==='quien'){const e=Object.entries(i.tally).sort((a,b)=>b[1]-a[1])[0];if(e)it.push([t,`🗳️ ${esc(p.text)} → <b>${esc(nm(e[0]))}</b>`])}
  }
  for(const a of S.accus)if(a.answer==='si')it.push([a.answeredAt||a.at,`🕵️ <b>${esc(nm(a.by))}</b> ha PILLADO la misión de <b>${esc(nm(a.target))}</b> (+8)`]);
  for(const c of S.confes)it.push([c.at,`🤫 Nueva confesión anónima en el confesionario`]);
  return it.sort((a,b)=>b[0]-a[0]).slice(0,15);
}

}

function titles(C){
  const U=ids();const T=[['drinks','🍺 La Esponja'],['risas','😂 La Más Graciosa'],['frases','💬 La Poeta del Bar'],['retoOk','🎲 La Imparable'],['culp','⚖️ La Más Juzgada'],['detect','🕵️ La Detective'],['quien','🗳️ La Más Señalada'],['falsas','🐍 La Chivata'],['retoKo','🐔 La Rajada'],['tramp','🤥 La Tramposa']];
  return T.map(([k,l])=>{const mx=Math.max(0,...U.map(u=>C.st[u][k]||0));if(!mx)return null;return{l,who:U.filter(u=>(C.st[u][k]||0)===mx),v:mx}}).filter(Boolean);
}
function wrapped(C){
  const tot={cana:0,vino:0,copa:0,chupito:0};S.events.forEach(e=>{if(okDrink(e))tot[e.sub]=(tot[e.sub]||0)+1});
  const t={};S.votes.filter(v=>v.poll==='frase_final').forEach(v=>t[v.choice]=(t[v.choice]||0)+1);
  const mx=Math.max(0,...Object.values(t));const top=S.frases.filter(f=>mx>0&&t[f.id]===mx);
  const plain=u=>{const p=S.players[u];return p?p.nick:'Alguien'};
  let s=`🎄 FRIENDS · COMIDA DE NAVIDAD ${new Date(S.game.startedAt).getFullYear()} 🎄\n\n`;
  s+=`👑 REINA DE LA NOCHE: ${plain(C.rank[0].id)} (${C.rank[0].pts} pts)\n\n🏆 RANKING\n`+C.rank.map((r,i)=>`${i+1}. ${plain(r.id)} — ${r.pts} pts`).join('\n');
  s+=`\n\n🍻 ${tot.cana} cañas · ${tot.vino} vinos · ${tot.copa} copas · ${tot.chupito} chupitos\n`;
  const T=titles(C);if(T.length)s+=`\n🏅 TÍTULOS\n`+T.map(x=>`${x.l}: ${x.who.map(plain).join(' y ')}`).join('\n')+'\n';
  if(top.length)s+=`\n💬 FRASE DE LA NOCHE\n`+top.map(f=>`«${f.text}» — ${plain(f.who)}`).join('\n')+'\n';
  const jc=S.polls.filter(p=>p.kind==='juicio').length;
  s+=`\n⚖️ ${jc} juicios · 🤫 ${S.confes.length} confesiones · 💬 ${S.frases.length} frases épicas\n\nLo que pasa en la comida, se queda en la comida 🤐`;
  return s;
}
function vRanking(C){
  let h='';const fin=C.fin;
  if(!fin.on){
    h+=`<div class="card"><div class="h ttl gold">🧾 ¿PEDIMOS LA CUENTA?</div><p class="sm mut">Cuando la mitad de la mesa lo pida (${fin.need}) empieza la GRAN FINAL: se revelan las misiones, se vota la frase de la noche y se corona a la reina.</p><div class="bar"><i style="width:${fin.count/fin.need*100}%"></i></div><p class="center"><b>${fin.count}/${fin.need}</b></p><button class="btn ${fin.mine?'ghost':'red'} full" data-act="fin">${fin.mine?'↩️ Mejor seguimos un rato':'🧾 ¡Yo pido la cuenta!'}</button></div>`;
    h+=`<div class="h sec">🏆 CLASIFICACIÓN</div><div class="card">${C.rank.map((r,i)=>`<div class="row ${i===0?'p1':''}"><span class="pos">${i===0?'👑':i+1}</span>${av(r.id,44)}<span class="who">${esc(S.players[r.id].nick)}${r.id===ME?' <span class="tag">TÚ</span>':''}<div class="sm mut" style="font-weight:400">🍻${r.drinks} · 😂${r.risas} · 💬${r.frases} · 🎲${r.retoOk}/${r.retoOk+r.retoKo} · ⚖️${r.culp}</div></span><span class="sc h">${r.pts}</span></div>`).join('')}</div>`;
    return h;
  }
  h+=`<div class="card alert center"><div class="h" style="font-size:30px;color:var(--gold)">🏁 GRAN FINAL</div><p>Ya no hay más retos. Ahora toca votar y coronar.</p></div>`;
  // 1. frase de la noche
  const myF=S.votes.find(v=>v.poll==='frase_final'&&v.uid===ME);const t={};S.votes.filter(v=>v.poll==='frase_final').forEach(v=>t[v.choice]=(t[v.choice]||0)+1);
  h+=`<div class="h sec">1 · 💬 FRASE DE LA NOCHE</div>`;
  h+=S.frases.length?`<p class="sm mut">Vota tu favorita (+15 para la autora). ${Object.values(t).reduce((a,b)=>a+b,0)} votos.</p>`+[...S.frases].sort((a,b)=>a.at-b.at).map(f=>`<div class="card"><div class="frase">«${esc(f.text)}»</div><div class="sm mut">— ${esc(nm(f.who))}${myF?` · <b>${t[f.id]||0} votos</b>`:''}</div><button class="btn ${myF&&myF.choice===f.id?'':'ghost'} full" data-act="vote" data-p="frase_final" data-c="${f.id}">${myF&&myF.choice===f.id?'⭐ Tu voto':'⭐ Votar esta'}</button></div>`).join(''):`<p class="mut">No se apuntó ninguna frase 😢</p>`;
  // 2. misiones
  h+=`<div class="h sec">2 · 🕵️ LAS MISIONES ERAN…</div><div class="card">${plist().map(p=>{const s=C.st[p.id];return `<div class="tit"><span><b>${esc(nm(p.id))}</b><br><span class="sm">${esc(missionOf(p.id))}</span></span><b>${s.mision==='ok'?'✅':s.pillada?'🙈':'❌'}</b></div>`}).join('')}</div>`;
  // 3. revelación
  h+=`<div class="h sec">3 · 👑 LA CORONACIÓN</div>`;
  const n=C.rank.length;
  if(RANKSTEP===null)h+=`<p class="mut">Juntaos todas, que alguien ponga redoble de tambores 🥁 y ve revelando de la última a la primera.</p><button class="btn red full bigb" data-act="next">🥁 Revelar puesto ${n}</button>`;
  else{
    h+=`<div class="card">${C.rank.map((r,i)=>i>=RANKSTEP?`<div class="row reveal-row ${i===0?'p1':''}"><span class="pos">${i===0?'👑':i+1}</span>${av(r.id,44)}<span class="who">${esc(S.players[r.id].nick)}</span><span class="sc h">${r.pts}</span></div>`:'').join('')}</div>`;
    if(RANKSTEP>0)h+=`<button class="btn red full bigb" data-act="next">🥁 Revelar puesto ${RANKSTEP}${RANKSTEP===1?' 👑':''}</button>`;
    else{
      h+=`<div class="card center" style="border-color:var(--gold)"><div style="font-size:50px">👑🎉🍾</div>${av(C.rank[0].id,150)}<div class="h" style="font-size:24px;color:var(--gold)">${esc(nm(C.rank[0].id)).toUpperCase()}</div><div>REINA DE LA NOCHE</div>${n>1?`<p class="sm mut">Y el farolillo rojo es para ${esc(nm(C.rank[n-1].id))}: elige ella la próxima ronda… y la paga 😇</p>`:''}</div>`;
      const T=titles(C);if(T.length)h+=`<div class="h sec">🏅 TÍTULOS</div><div class="card">${T.map(x=>`<div class="tit"><span>${x.l}</span><b>${x.who.map(u=>esc(nm(u))).join(' y ')}</b></div>`).join('')}</div>`;
      h+=`<div class="h sec">📲 RESUMEN PARA EL GRUPO</div><pre class="wr" id="wrapped">${esc(wrapped(C))}</pre><button class="btn full" data-act="copy">📋 Copiar para WhatsApp</button>`;
    }
  }
  return h;
}

/* ===================== RENDER ===================== */
function viewKey(){if(FATAL)return'fatal';if(AUTHED===false)return'login';if(!S.loaded)return'loading';if(!S.players[ME])return'register';if(!started())return'lobby';return TAB+':'+ids().length}
function renderTop(C){
  const p=S.players[ME];$('#mechip').innerHTML=p&&started()?`<div class="mechip">${av(ME,26)} <b>${C.st[ME]?C.st[ME].pts:0}</b> pts</div>`:'';
}
function renderNav(C,pend){
  const k=viewKey();if(!started()||!S.players[ME]||k==='fatal'){$('#nav').innerHTML='';return}
  const tabs=[['home','🍻','Inicio'],['mision','🕵️','Misión'],['votos','⚖️','Votos'],['frases','💬','Frases'],['confes','🤫','Confesión'],['ranking','🏆','Ranking']];
  const bad=pend.filter(x=>!x.res&&!x.chk).length;
  $('#nav').innerHTML=`<div class="in">${tabs.map(([v,i,l])=>`<button class="${TAB===v?'on':''}" data-act="tab" data-v="${v}"><span class="i">${i}</span>${l}${v==='votos'&&bad?`<span class="badge">${bad}</span>`:''}</button>`).join('')}</div>`;
}
function renderAlerts(pend){
  const k=viewKey();if(['fatal','loading','register','lobby','login'].includes(k)){$('#alerts').innerHTML='';return}
  let alarm=false;for(const x of pend)if(!x.chk&&!SEEN.has(x.id)){SEEN.add(x.id);if(!x.res)alarm=true}
  if(alarm){siren();saveSeen()}
  const chks=pend.filter(x=>x.chk);pend=pend.filter(x=>!x.chk);
  const show=pend.slice(0,3);
  $('#alerts').innerHTML=(chks.length?`<div class="h sm" style="margin:12px 0 -6px">🍻 VALIDA LAS BEBIDAS DE TUS AMIGAS</div>`:'')+chks.slice(0,5).map(x=>x.html).join('')+show.map(x=>x.html).join('')+(pend.length>3?`<p class="center sm"><a href="#" data-act="tab" data-v="votos" style="color:var(--gold)">+${pend.length-3} más en Votos →</a></p>`:'');
}
function renderMain(C,full){
  const m=$('#main'),fk=viewKey(),k=fk.split(':')[0];
  if(full||m.dataset.key!==fk){
    m.dataset.key=fk;
    if(k==='fatal')m.innerHTML=`<div class="card center"><div style="font-size:48px">🔒</div><div class="h ttl">ALGO NO VA</div><p>${esc(FATAL)}</p></div>`;
    else if(k==='loading')m.innerHTML=`<div class="card center"><div style="font-size:48px">🍻</div><p id="loadmsg">Preparando la mesa…</p></div>`;
    else if(k==='register')m.innerHTML=vRegister();
    else if(k==='login')m.innerHTML=vLogin();
    else if(k==='mision')m.innerHTML=formMision();
    else if(k==='votos')m.innerHTML=formVotos();
    else if(k==='frases')m.innerHTML=formFrases();
    else if(k==='confes')m.innerHTML=formConfes();
    else m.innerHTML='<div id="list"></div>';
  }
  const L=$('#list');if(!L)return;
  const V={lobby:vLobby,home:vHome,mision:vMision,votos:vVotos,frases:vFrases,confes:vConfes,ranking:vRanking}[k];
  if(V)L.innerHTML=V(C);
}
function renderAll(full){
  const C=compute();const pend=started()&&S.players[ME]?pendingItems(C):[];
  if(started()){const tot=totalDrinks();const li=levelOf(tot);if(LASTLVL!==null&&li>LASTLVL){toast(`🚨 NIVEL ${li+1}: ${LEVELS[li][1]} ${LEVELS[li][2]}`);siren()}LASTLVL=li}
  renderTop(C);renderAlerts(pend);renderNav(C,pend);renderMain(C,full);
  LASTSIG=signature();
}
function signature(){if(!started())return'';const f=finInfo();return allPolls().map(p=>p.id+(pollInfo(p).closed?'c':'o')).join(',')+'|'+f.on+'|'+(now()>=RETOS_AT)+'|'+Math.floor(now()/30000)}
let rt=null;function changed(){clearTimeout(rt);rt=setTimeout(()=>renderAll(),60)}
setInterval(()=>{document.querySelectorAll('[data-ends]').forEach(el=>el.textContent=mmss(+el.dataset.ends-now()));document.querySelectorAll('[data-until]').forEach(el=>el.textContent=dhms(+el.dataset.until-now()));if(S.loaded&&!FATAL){const s=signature();if(s!==LASTSIG)renderAll()}},1000);

/* ===================== ARRANQUE (Firebase) ===================== */
let AUTH=null,AUTHED=null,LOGINMODE='in';
const AUTHERR={'auth/invalid-credential':'Email o contraseña incorrectos','auth/wrong-password':'Contraseña incorrecta','auth/user-not-found':'No hay ninguna cuenta con ese email. Dale a «Crear cuenta»','auth/email-already-in-use':'Ya existe una cuenta con ese email. Dale a «Entrar»','auth/weak-password':'La contraseña tiene que tener al menos 6 caracteres','auth/invalid-email':'Ese email no es válido','auth/too-many-requests':'Demasiados intentos. Espera un poco','auth/network-request-failed':'Sin conexión 📶','auth/missing-password':'Pon la contraseña'};
const authMsg=e=>AUTHERR[e&&e.code]||'Algo ha fallado. Prueba otra vez';
async function init(){
  renderAll(true);
  const cfg=window.FIREBASE_CONFIG||{};
  if(!window.firebase||!cfg.apiKey||/PEGA/.test(cfg.apiKey)){FATAL='Falta configurar Firebase en el archivo config.js.';renderAll(true);return}
  try{firebase.initializeApp(cfg);AUTH=firebase.auth();db=firebase.firestore()}catch(e){console.warn(e);FATAL='La configuración de Firebase no es correcta.';renderAll(true);return}
  AUTH.onAuthStateChanged(u=>{
    if(!u){AUTHED=false;renderAll(true);return}
    if(AUTHED&&ME===u.uid)return;
    AUTHED=true;ME=u.uid;startData();
  });
}
function startData(){
  renderAll(true);
  const timer=setTimeout(()=>{if(!S.loaded){const el=$('#loadmsg');if(el)el.textContent='No consigo conectar todavía… revisa tu conexión 📶'}},10000);
  const err=e=>{console.warn('db',e);if(e&&e.code==='permission-denied'){clearTimeout(timer);FATAL='Firebase no deja leer los datos: revisa que las reglas de Firestore estén publicadas.';renderAll(true)}};
  const col=(name)=>db.collection(name).onSnapshot(s=>{S[name]=s.docs.map(d=>({id:d.id,...d.data()}));changed()},err);
  db.doc('game/state').onSnapshot(s=>{S.game=s.exists?s.data():null;if(!S.loaded){S.loaded=true;clearTimeout(timer)}changed()},err);
  db.collection('players').onSnapshot(s=>{const P={};s.docs.forEach(d=>P[d.id]={id:d.id,...d.data()});S.players=P;changed()},err);
  ['events','frases','polls','votes','accus','confes','fin'].forEach(col);
  db.doc('data/users/'+ME+'/me').onSnapshot(s=>{S.mine=s.exists?s.data():{};changed()},err);
}
async function doLogin(f){
  const email=f.elements.email.value.trim(),pass=f.elements.pass.value;
  const btn=f.querySelector('button[type=submit]');if(btn)btn.disabled=true;
  try{
    if(LOGINMODE==='up'){if(pass!==f.elements.pass2.value){toast('Las contraseñas no coinciden');return}await AUTH.createUserWithEmailAndPassword(email,pass);toast('¡Cuenta creada! 🎉')}
    else await AUTH.signInWithEmailAndPassword(email,pass);
  }catch(e){console.warn(e);toast(authMsg(e))}
  finally{if(btn)btn.disabled=false}
}
async function doResetPass(){
  const f=document.querySelector('form[data-form=login]');const email=f?f.elements.email.value.trim():'';
  if(!email)return toast('Escribe tu email arriba y vuelve a pulsar');
  try{await AUTH.sendPasswordResetEmail(email);toast('📧 Te hemos mandado un email para cambiarla (mira en spam)')}catch(e){toast(authMsg(e))}
}
function vLogin(){
  const up=LOGINMODE==='up';
  return `<div class="card hero"><div class="h" style="font-size:18px">Bienvenida a la comida de Navidad de</div><div class="fr">Friends<i>.</i></div><p>Puntos por cañas, risas y frases épicas, retos sorpresa, juicios, misiones secretas y confesionario anónimo. Lo que pasa en la comida… se queda en la app.</p></div>
  <form class="card" data-form="login"><div class="h ttl green">${up?'✨ CREA TU CUENTA':'🔑 ENTRA'}</div>
  <label>Email</label><input name="email" type="email" autocomplete="email" required placeholder="tu@email.com">
  <label>Contraseña</label><input name="pass" type="password" autocomplete="${up?'new-password':'current-password'}" required minlength="6" placeholder="${up?'Mínimo 6 caracteres':'Tu contraseña'}">
  ${up?'<label>Repite la contraseña</label><input name="pass2" type="password" autocomplete="new-password" required minlength="6">':''}
  <button type="submit" class="btn red full bigb">${up?'Crear cuenta 🍻':'Entrar 🍻'}</button>
  <button type="button" class="btn ghost full" data-act="loginmode">${up?'Ya tengo cuenta → Entrar':'Es mi primera vez → Crear cuenta'}</button>
  ${up?'':'<p class="center sm"><a href="#" data-act="resetpass" style="color:var(--mut)">¿Olvidaste la contraseña?</a></p>'}</form>${placeCard()}`;
}
init();
</script>
